name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  # A tag push used to publish unconditionally, so a broken commit - or a tag that
  # disagreed with pyproject.toml - would reach PyPI, where a version can never be
  # reused. Both are gates now instead of hopes.
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.14" ]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: The tag must match the version being published
        run: |
          version=$(uv run python -c "import importlib.metadata as m; print(m.version('rss-parser'))")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag project=$version"
          test "$tag" = "$version"

      - name: Lint code with black
        run: uv run black --check .

      - name: Lint code with ruff
        run: uv run ruff check .

      - name: Lint code with mypy
        run: uv run mypy rss_parser

      - name: Test code with pytest
        run: uv run pytest --doctest-modules rss_parser tests --cov=rss_parser

  build-and-publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.pypi_password }}
